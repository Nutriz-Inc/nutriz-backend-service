services:
  database:
    image: pgvector/pgvector:pg16
    container_name: database
    ports:
      - 5435:5432
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nutriz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    ports:
      - 6398:6379
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 3333:3333
    environment:
      # Overrides the values loaded from .env.development so the app
      # reaches the other containers by service name instead of localhost.
      - DATABASE_DSN=postgres://postgres:postgres@database:5432/nutriz?sslmode=disable
      - REDIS_ADDR=redis:6379